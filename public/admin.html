<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trạm trực · Dark Control Panel</title>
<meta name="theme-color" content="#111318">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/app.css">

<style id="admin-dark-reference-v3">
:root{
  --bg:#16181d;
  --panel:#1b1e24;
  --panel-2:#20242b;
  --panel-3:#252931;
  --line:#2d323b;
  --line-2:#383e49;

  --tx:#f5f7fb;
  --tx-2:#c1c7d0;
  --tx-3:#7f8794;

  --pri:#8b5cf6;
  --pri-2:#a855f7;
  --pri-s:rgba(139,92,246,.14);

  --cyan:#22a7ff;
  --cyan-2:#168ee0;
  --green:#2bd67b;
  --amber:#f5b849;
  --red:#ff6666;
  --pink:#ff5ca8;

  --s1:4px;--s2:8px;--s3:12px;--s4:16px;--s5:20px;--s6:24px;
  --radius:14px;
  --radius-lg:18px;
  --shadow:0 18px 48px rgba(0,0,0,.28);
}

*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  background:
    radial-gradient(circle at 72% -10%,rgba(139,92,246,.10),transparent 25%),
    #14161b;
  color:var(--tx);
  font-family:'Be Vietnam Pro',system-ui,-apple-system,sans-serif;
  font-size:13px;
  -webkit-font-smoothing:antialiased;
}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{
  outline:none;
  box-shadow:0 0 0 3px rgba(34,167,255,.18)!important;
}

/* ===== app shell ===== */
#app{
  min-height:100vh;
  display:grid;
  grid-template-columns:220px minmax(0,1fr);
  grid-template-rows:64px auto;
  grid-template-areas:
    "side top"
    "side main";
}
.side{
  grid-area:side;
  position:sticky;
  top:0;
  height:100vh;
  padding:18px 12px 14px;
  background:#111318;
  border-right:1px solid #252a31;
  display:flex;
  flex-direction:column;
  overflow:hidden;
  z-index:20;
}
.brand{
  display:flex;
  align-items:center;
  gap:10px;
  min-height:52px;
  padding:4px 7px 16px;
}
.brand-mark{
  width:34px;height:34px;
  display:grid;place-items:center;
  border-radius:10px;
  color:#fff;
  font-size:12px;
  font-weight:900;
  background:linear-gradient(135deg,#a855f7,#6d5dfc);
  box-shadow:0 8px 20px rgba(139,92,246,.28);
}
.brand-copy .lg{
  display:block;
  color:#fff;
  font-size:14px;
  font-weight:800;
}
.brand-copy small{
  display:block;
  margin-top:3px;
  color:#6f7784;
  font-size:8px;
  font-weight:800;
  letter-spacing:.12em;
  text-transform:uppercase;
}
.scope-side{
  padding:0 4px 10px;
}
.scope-side .pill{
  width:100%;
  justify-content:flex-start;
  color:#aeb4bf!important;
  background:#1b1e24!important;
  border-color:#292e36!important;
}
.nav-label{
  padding:7px 9px 5px;
  color:#59616d;
  font-size:8px;
  font-weight:800;
  letter-spacing:.13em;
  text-transform:uppercase;
}
.tabs{
  flex:1;
  display:flex;
  flex-direction:column;
  gap:4px;
  overflow-y:auto;
  margin:0;
  padding:0 2px;
  border:0;
  background:transparent;
}
.tabs button{
  width:100%;
  min-height:40px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px 10px;
  border:0;
  border-radius:10px;
  color:#9299a5;
  background:transparent;
  cursor:pointer;
  font-size:11.5px;
  font-weight:650;
  text-align:left;
}
.tabs button:hover{
  color:#e6eaf0;
  background:#1c1f25;
}
.tabs button.on{
  color:#fff;
  background:#282c33;
  box-shadow:inset 0 0 0 1px #353a43;
}
.nav-ico{
  width:27px;height:27px;
  display:grid;place-items:center;
  flex:none;
  border-radius:8px;
  color:#777f8c;
}
.tabs button.on .nav-ico{
  color:#b983ff;
  background:rgba(139,92,246,.10);
}
.nav-ico svg{
  width:15px;height:15px;
  fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round;
}
.side-foot{
  padding:12px 9px 4px;
  border-top:1px solid #23272e;
  color:#666e7b;
  font-size:9.5px;
  line-height:1.55;
}
.side-live{
  display:flex;
  align-items:center;
  gap:7px;
  color:#a7adb7;
  margin-bottom:5px;
  font-weight:650;
}
.live-dot{
  width:7px;height:7px;border-radius:50%;
  background:#31d98b;
  box-shadow:0 0 0 4px rgba(49,217,139,.08);
}

/* ===== topbar ===== */
.top{
  grid-area:top;
  position:sticky;
  top:0;
  z-index:15;
  height:64px;
  display:flex;
  align-items:center;
  gap:9px;
  padding:0 20px;
  background:rgba(20,22,27,.90);
  backdrop-filter:blur(16px);
  border-bottom:1px solid #252a31;
}
.search-shell{
  width:min(330px,34vw);
  height:34px;
  display:flex;
  align-items:center;
  gap:8px;
  padding:0 11px;
  border:1px solid #30353e;
  border-radius:9px;
  color:#6d7581;
  background:#202329;
}
.search-shell svg{
  width:14px;height:14px;
  stroke:#5eaef2;
  fill:none;stroke-width:1.8;
}
.search-shell input{
  flex:1;
  width:auto;
  min-height:0;
  padding:0;
  border:0;
  outline:none;
  color:#d7dbe2;
  background:transparent;
  font-size:10.5px;
}
.search-shell input::placeholder{color:#69717d}
.top .sp{flex:1}
.top-context{
  display:flex;
  align-items:center;
  gap:7px;
  color:#747c88;
  font-size:10px;
}
.top-context .crumb{color:#c4c9d1;font-weight:700}
.vr{width:1px;height:22px;background:#30353d}
.mini{
  min-height:32px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:6px 9px;
  border:1px solid #30353d;
  border-radius:9px;
  color:#9da4af;
  background:#1e2127;
  text-decoration:none;
  cursor:pointer;
  font-size:10px;
  font-weight:650;
}
.mini:hover{color:#fff;border-color:#3c424c;background:#242830}
.mini.danger{color:#ff8585}
.action-btn{
  min-height:34px;
  display:inline-flex;
  align-items:center;
  gap:6px;
  padding:7px 12px;
  border:0;
  border-radius:9px;
  color:#fff;
  background:linear-gradient(180deg,#22a7ff,#168ee0);
  box-shadow:0 5px 16px rgba(34,167,255,.20);
  font-size:10.5px;
  font-weight:750;
}

/* ===== main ===== */
.adm{
  grid-area:main;
  width:min(1480px,100%);
  padding:24px 22px 54px;
  margin:0 auto;
}
.page-head{
  display:flex;
  align-items:flex-end;
  gap:16px;
  margin-bottom:16px;
}
.page-head h1{
  margin:0;
  color:#fff;
  font-size:22px;
  font-weight:800;
  letter-spacing:-.03em;
}
.page-head p{
  margin:5px 0 0;
  color:#717a87;
  font-size:10.5px;
}
.page-head .sp{margin-left:auto;display:flex;gap:8px}

/* ===== cards ===== */
.card,.tw,.fil,.kpi{
  border:1px solid #292e36;
  background:#1a1d22;
  box-shadow:none;
}
.card{
  border-radius:13px;
}
.card-p{padding:15px}
.card-h{
  min-height:48px;
  display:flex;
  align-items:center;
  gap:10px;
  padding:0 15px;
  border-bottom:1px solid #292e36;
}
.card-h .t{
  color:#c7cbd2;
  font-size:10px;
  font-weight:750;
}
.card-h .r{
  margin-left:auto;
  color:#646c78;
  font-size:9.5px;
}
.sec{
  display:flex;
  align-items:center;
  gap:10px;
  margin:22px 0 10px;
}
.sec .t{
  color:#7c8490;
  font-size:9.5px;
  font-weight:800;
  letter-spacing:.08em;
  text-transform:uppercase;
}
.sec .rule{height:1px;flex:1;background:#292e36}
.sec .r{color:#646c78;font-size:9.5px}

/* ===== KPI ===== */
.kpis{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(145px,1fr));
  gap:10px;
  margin-bottom:14px;
}
.kpi{
  min-height:105px;
  position:relative;
  overflow:hidden;
  padding:15px 16px;
  border-radius:12px;
}
.kpi::before{
  content:"";
  position:absolute;
  width:90px;height:90px;
  right:-38px;top:-42px;
  border-radius:50%;
  background:rgba(255,255,255,.018);
}
.kpi .n{
  color:#fff;
  font-size:27px;
  line-height:1;
  font-weight:800;
  letter-spacing:-.04em;
}
.kpi .l{
  margin-top:10px;
  color:#737b87;
  font-size:9.5px;
  font-weight:600;
}
.kpi.pri{
  background:
    radial-gradient(circle at 90% 10%,rgba(139,92,246,.14),transparent 28%),
    #1b1e24;
}
.kpi.pri .n{color:#bd8cff}
.kpi.amb .n{color:#f6bb58}
.kpi.red .n{color:#ff7070}
.kpi.blu .n{color:#66b9ff}

/* ===== filters/form ===== */
.fil{
  display:flex;
  flex-wrap:wrap;
  align-items:flex-end;
  gap:9px;
  padding:11px;
  margin-bottom:13px;
  border-radius:12px;
}
.f{min-width:128px;flex:1}
.fil .f{flex:0 1 150px}
.row{display:flex;flex-wrap:wrap;align-items:flex-end;gap:9px}
label{
  display:block;
  margin-bottom:5px;
  color:#727a86;
  font-size:9px;
  font-weight:700;
}
input,select,textarea{
  width:100%;
  min-height:35px;
  padding:7px 9px;
  border:1px solid #343943;
  border-radius:8px;
  color:#dfe3ea;
  background:#202329;
  font-size:10.5px;
}
input::placeholder,textarea::placeholder{color:#5d6570}
input:focus,select:focus,textarea:focus{
  border-color:#6b6ff0;
  box-shadow:0 0 0 3px rgba(107,111,240,.10);
}

/* ===== buttons ===== */
.btn{
  min-height:33px;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  padding:6px 10px;
  border:1px solid #343943;
  border-radius:8px;
  color:#abb1bb;
  background:#202329;
  cursor:pointer;
  font-size:9.5px;
  font-weight:700;
}
.btn:hover{color:#fff;border-color:#434a55;background:#252930}
.btn-sm{min-height:29px;padding:4px 8px;font-size:9px}
.btn-pri{
  color:#fff!important;
  border-color:#7b56e7!important;
  background:linear-gradient(180deg,#8b5cf6,#7547e6)!important;
}
.btn-red{
  color:#ff8080!important;
  border-color:#553136!important;
  background:#251a1c!important;
}

/* ===== table ===== */
.tw{
  width:100%;
  overflow:auto;
  border-radius:12px;
}
.tw::-webkit-scrollbar{height:7px;width:7px}
.tw::-webkit-scrollbar-thumb{background:#343943;border-radius:999px}
table{
  width:100%;
  border-collapse:separate;
  border-spacing:0;
  font-size:10.5px;
}
th{
  position:sticky;
  top:0;
  z-index:1;
  padding:9px 10px;
  color:#777f8c;
  background:#202329;
  border-bottom:1px solid #30353d;
  font-size:8.5px;
  font-weight:800;
  letter-spacing:.05em;
  text-transform:uppercase;
  text-align:left;
  white-space:nowrap;
}
td{
  padding:10px;
  color:#b9c0ca;
  background:#1a1d22;
  border-bottom:1px solid #242930;
  vertical-align:middle;
}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#1e2228}
tr.row-alert td{background:#241a1c}
th.c,td.c{text-align:center}
th.r,td.r{text-align:right}
th.wide,td.wide{min-width:165px}

/* ===== status ===== */
.sub{color:#69717d;font-size:9.5px}
.pill{
  min-height:20px;
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding:3px 7px;
  border:1px solid #343943;
  border-radius:999px;
  color:#8e96a2;
  background:#242830;
  font-size:8.5px;
  font-weight:700;
}
.pill.pri{color:#c59bff;border-color:#4b3b67;background:#271f33}
.pill.red{color:#ff7c7c;border-color:#503033;background:#251a1c}
.pill.amb{color:#f2bd63;border-color:#524026;background:#272116}
.pill.blu{color:#68b9ff;border-color:#29445b;background:#19232c}
.dot{width:5px;height:5px;border-radius:50%;background:currentColor}
.mono,code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.keybox{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.keybox code{
  padding:4px 7px;
  border:1px solid #323740;
  border-radius:7px;
  color:#bb8bff;
  background:#201c26;
}
.lbar{height:4px;margin-top:6px;overflow:hidden;border-radius:999px;background:#2b3038}
.lbar i{display:block;height:100%;background:linear-gradient(90deg,#ff6a9c,#8b5cf6)}

/* ===== misc components ===== */
.grid14{display:flex;gap:3px;flex-wrap:wrap}
.gcell{
  width:22px;height:22px;
  display:grid;place-items:center;
  border-radius:6px;
  border:1px solid #323740;
  color:#737b87;
  background:#202329;
  font-size:8px;
  font-style:normal;
}
.gcell.ok{color:#62e5a0;border-color:#264b3a;background:#17261f}
.gcell.miss{color:#ff8080;border-color:#503033;background:#251a1c}
.gcell.ex{color:#777f8c;background:#22262c}
.gcell.today{box-shadow:inset 0 0 0 1px #d49d45}
.shrow{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid #292e36}
.shrow:first-child{border-top:0}
.shrow .d{width:6px;height:6px;border-radius:50%;background:#2bd67b}
.shrow.bad .d{background:#ff6666}
.checks{display:flex;gap:6px;flex-wrap:wrap}
.check{
  display:inline-flex;align-items:center;gap:6px;
  padding:6px 8px;border:1px solid #343943;border-radius:8px;
  color:#8d95a0;background:#202329;
}
.check.on{color:#c89fff;border-color:#4b3c66;background:#251f31}
.check .box{width:14px;height:14px;display:grid;place-items:center;border:1px solid #444a54;border-radius:4px}
.check.on .box{background:#8b5cf6;border-color:#8b5cf6;color:#fff}
.legend{display:flex;gap:10px;flex-wrap:wrap;color:#737b87;font-size:9px}
.daytag{display:inline-flex;align-items:center;gap:4px;padding:3px 7px;border-radius:7px;color:#c18eff;background:#241e30;border:1px solid #45385d}

/* ===== login gate ===== */
.gate{
  position:fixed;
  inset:0;
  display:grid;
  place-items:center;
  padding:20px;
  background:
    radial-gradient(circle at 70% 15%,rgba(139,92,246,.15),transparent 28%),
    #101216;
}
.gate>.card{
  width:min(390px,100%);
  padding:28px;
  border:1px solid #2d323a;
  border-radius:16px;
  background:#191c21;
  box-shadow:var(--shadow);
}
.gate>.card::before{
  content:"TT";
  width:42px;height:42px;
  display:grid;place-items:center;
  margin-bottom:16px;
  border-radius:11px;
  color:#fff;
  background:linear-gradient(135deg,#a855f7,#6d5dfc);
  font-weight:900;
}
.gate h1{margin:0 0 5px;color:#fff;font-size:18px}
.gate p{margin:0 0 17px;color:#727a86;font-size:10.5px;line-height:1.55}
.gate label{display:block;margin-top:11px}
.gate .btn-block{width:100%;margin-top:4px}
.err{min-height:16px;margin-top:7px;color:#ff7777;font-size:9.5px}

/* ===== modal ===== */
.cam-modal{
  position:fixed;
  inset:0;
  z-index:70;
  display:grid;
  place-items:center;
  padding:20px;
  background:rgba(6,8,11,.74);
  backdrop-filter:blur(7px);
}
.cam-box{
  width:min(850px,94vw);
  max-height:90vh;
  overflow:hidden;
  border:1px solid #343943;
  border-radius:15px;
  background:#191c21;
  box-shadow:0 26px 80px rgba(0,0,0,.42);
}
.cam-h{
  min-height:50px;
  display:flex;align-items:center;gap:10px;
  padding:0 14px;
  border-bottom:1px solid #292e36;
  color:#d9dde4;font-size:11px;font-weight:750;
}
.cam-h .x{
  width:29px;height:29px;display:grid;place-items:center;
  margin-left:auto;border:1px solid #343943;border-radius:8px;
  color:#89919d;background:#202329;cursor:pointer;font-size:16px;
}
.cam-view{background:#0d0f12}

/* ===== toast ===== */
.toast{
  position:fixed;
  right:18px;top:17px;z-index:90;
  min-width:270px;max-width:360px;
  display:flex;align-items:flex-start;gap:9px;
  padding:11px 12px;
  border:1px solid #30473b;
  border-radius:10px;
  color:#b8e8cb;
  background:#18211d;
  box-shadow:0 14px 38px rgba(0,0,0,.32);
}
.toast.err{color:#ffc0c0;border-color:#503033;background:#251a1c}
.toast>.b{width:6px;height:6px;margin-top:4px;border-radius:50%;background:#2bd67b}
.toast.err>.b{background:#ff6666}
.toast .tt{font-size:10px;font-weight:800}
.toast .ts{margin-top:2px;color:#727a86;font-size:9px}
.toast.hide{opacity:0;transform:translateY(-8px);pointer-events:none}

/* ===== responsive ===== */
@media(max-width:1050px){
  #app{grid-template-columns:74px minmax(0,1fr)}
  .side{padding:14px 8px}
  .brand{justify-content:center;padding:4px 0 14px}
  .brand-copy,.scope-side,.nav-label,.side-foot{display:none}
  .tabs button{justify-content:center;min-height:43px;padding:7px;font-size:0}
}
@media(max-width:720px){
  #app{display:block;padding-bottom:70px}
  .side{
    position:fixed;left:0;right:0;bottom:0;top:auto;
    width:100%;height:64px;padding:6px 7px;
    border-right:0;border-top:1px solid #292e36;
    background:rgba(17,19,24,.98);
  }
  .brand,.scope-side,.nav-label,.side-foot{display:none}
  .tabs{display:flex;flex-direction:row;overflow-x:auto;gap:3px}
  .tabs button{
    min-width:58px;flex:1 0 58px;flex-direction:column;
    min-height:50px;gap:2px;padding:4px;font-size:7.5px;
  }
  .nav-ico{width:22px;height:22px}
  .top{height:57px;padding:0 10px}
  .search-shell{display:none}
  .top-context{display:none}
  .action-btn{display:none}
  .adm{padding:18px 10px 30px}
  .page-head{align-items:flex-start}
  .page-head h1{font-size:19px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .fil .f{flex:1 1 calc(50% - 8px)}
}
</style>

</head>
<body>

<div class="toast hide" id="toast"><span class="b"></span>
  <div><div class="tt" id="tt"></div><div class="ts" id="ts"></div></div></div>

<!-- Đăng nhập: chỉ quản trị mới cần -->
<div class="gate" id="gate" hidden>
  <div class="card">
    <h1>Quản trị</h1>
    <p>Nhân viên không cần đăng nhập — họ vào bằng link riêng.</p>
    <form id="lf">
      <label>Tài khoản<input name="username" autocapitalize="off" autocomplete="username" required></label>
      <label>Mật khẩu<input name="password" type="password" autocomplete="current-password" required></label>
      <button class="btn btn-pri btn-block" type="submit" id="lb">Đăng nhập</button>
      <div class="err" id="le"></div>
    </form>
  </div>
</div>

<div id="app" hidden>
  <aside class="side">
    <div class="brand">
      <span class="brand-mark">TT</span>
      <div class="brand-copy">
        <span class="lg">Trạm trực</span>
        <small>Control panel</small>
      </div>

<script>
const $ = s => document.querySelector(s);
/* Ngày trên đồng hồ của một mốc thời gian, để so với ngày của ca */
const isoDay = t => new Date(t).toLocaleDateString('en-CA');
const pad = n => String(n).padStart(2, '0');
const clk = s => (s < 0 ? '-' : '') + pad(Math.floor(Math.abs(s) / 60)) + ':' + pad(Math.abs(s) % 60);
const dmy = t => pad(new Date(t).getDate()) + '/' + pad(new Date(t).getMonth() + 1) + '/' + new Date(t).getFullYear();
const hms = t => t ? pad(new Date(t).getHours()) + ':' + pad(new Date(t).getMinutes()) + ':' + pad(new Date(t).getSeconds()) : '—';
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

let B = null, skew = 0, TAB = 'b';
const nowMs = () => Date.now() + skew;
const leftOf = h => Math.round((h.started_at + h.limit_minutes * 60000 - nowMs()) / 1000);
const pctOf  = h => Math.min(100, ((nowMs() - h.started_at) / (h.limit_minutes * 60000)) * 100);

function toast(t, s, ok) {
  const el = $('#toast');
  el.classList.toggle('err', !ok); el.classList.remove('hide');
  $('#tt').textContent = t; $('#ts').textContent = s || '';
  clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.add('hide'), 4200);
}

async function api(url, opts) {
  const r = await fetch(url, {
    headers: { 'Content-Type': 'application/json' }, ...opts,
    body: opts && opts.body ? JSON.stringify(opts.body) : undefined,
  });
  return { status: r.status, ...(await r.json().catch(() => ({}))) };
}

/* ---------- Đăng nhập ---------- */
$('#lf').addEventListener('submit', async e => {
  e.preventDefault();
  const f = new FormData(e.target);
  $('#lb').disabled = true;
  const r = await api('/api/admin/login', { method: 'POST',
    body: { username: f.get('username'), password: f.get('password') } });
  $('#lb').disabled = false;
  if (!r.ok) { $('#le').textContent = r.message || 'Không đăng nhập được.'; return; }
  $('#le').textContent = ''; load();
});
$('#out').addEventListener('click', async () => { await api('/api/logout', { method: 'POST' }); location.reload(); });
$('#pw').addEventListener('click', async () => {
  const c = prompt('Mật khẩu hiện tại:'); if (!c) return;
  const n = prompt('Mật khẩu mới (ít nhất 8 ký tự):'); if (!n) return;
  const r = await api('/api/admin/password', { method: 'POST', body: { current: c, next: n } });
  toast(r.ok ? 'Đã đổi mật khẩu' : 'Không đổi được', r.message || '', !!r.ok);
});

/* ---------- Tải ---------- */
/* Giá trị bộ lọc phải giữ trong JS, không đọc từ DOM.
   Bảng được vẽ lại sau mỗi lần lọc, nếu chỉ đọc DOM thì lựa chọn cũ biến mất
   và không kết hợp được nhiều tiêu chí. */
const BOARD_KEYS = ['user_id','type_code','brand','department','location','shift','from','to','only'];
let boardQ = Object.fromEntries(BOARD_KEYS.map(k => [k, k === 'only' ? 'active' : '']));

function qRead() {
  BOARD_KEYS.forEach(k => {
    const el = document.querySelector(`[data-q="${k}"]`);
    if (el) boardQ[k] = el.value;
  });
}
function qSet() { qRead(); load(); }
function q() {
  const p = new URLSearchParams();
  BOARD_KEYS.forEach(k => { if (boardQ[k]) p.set(k, boardQ[k]); });
  return p.toString();
}

async function load() {
  const r = await fetch('/api/admin/board?' + q() + (uQ && uQ.ym ? '&ym=' + uQ.ym : ''));
  if (r.status === 401 || r.status === 403) { $('#gate').hidden = false; $('#app').hidden = true; return; }
  B = await r.json();
  skew = B.server_time - Date.now();
  $('#gate').hidden = true; $('#app').hidden = false;

  const isSuper = B.me && B.me.role === 'super';
  $('#tm').hidden = !isSuper;
  $('#scopeTag').innerHTML = isSuper
    ? '<span class="pill">Quản trị tổng · cả hai brand</span>'
    : `<span class="pill pri">Brand ${esc(B.me ? B.me.brand : '')}</span>`;
  if (TAB === 'b') { renderBoard(); startBoardTimer(); } else renderUsers();
}

/* ---------- Theo dõi ---------- */
function renderBoard() {


  const cb = {
    staff: '<span class="sub">Nhân viên</span>',
    auto: '<span class="pill amb">Quên bấm</span>',
    admin: '<span class="pill">Quản trị</span>',
  };

  const trs = B.rows.map(r => `<tr>
    <td class="wide"><div style="font-weight:600">${esc(r.user_name)}</div>
      <div style="margin-top:5px;display:inline-flex;gap:5px">
        <span class="pill">${r.department || '—'}</span>
        ${r.brand ? `<span class="pill pri">${r.brand}</span>` : ''}</div></td>
    <td>${r.type_name}<div class="sub">cho phép ${r.limit_minutes} phút</div></td>
    <td>${dmy(r.started_at)}<div class="sub">${hms(r.started_at)}</div>
      ${r.shift_name ? `<div class="sub">${r.shift_name}</div>` : ''}
      ${r.shift_day && r.shift_day !== isoDay(r.started_at)
        ? `<div class="sub">thuộc ca ${r.shift_day.split('-').reverse().slice(0, 2).join('/')}</div>` : ''}</td>
    <td>${hms(r.ended_at)}${r.qua_dem ? ' <span class="pill">+1</span>' : ''}</td>
    <td>${r.duration_sec == null ? '<span class="pill amb">Đang chạy</span>'
      : `<span style="font-weight:600">${Math.floor(r.duration_sec/60)}p${pad(r.duration_sec%60)}s</span>
         <div style="margin-top:4px"><span class="pill ${r.is_over_limit ? 'red' : 'pri'}">${r.is_over_limit ? 'Quá giờ' : 'Trong giờ'}</span></div>`}</td>
    <td>${cb[r.closed_by] || '<span class="sub">—</span>'}</td>
    <td class="c">${r.screen_id
      ? `<button class="btn btn-sm" onclick="viewPhoto('activity',${r.screen_id},'screen')">Màn hình</button>`
      : '<span class="sub">—</span>'}</td>
    <td class="sub">${r.ip || '—'}</td>
    <td class="r">${r.ended_at ? '<span class="sub">—</span>'
      : `<button class="btn btn-red btn-sm" onclick="closeAct(${r.id})">Đóng hộ</button>`}</td></tr>`).join('');

  // Đánh dấu lại lựa chọn hiện tại sau mỗi lần vẽ
  const mark = (k, v) => boardQ[k] === String(v) ? ' selected' : '';
  const sel = (k, o, ph) => `<select data-q="${k}" onchange="qSet()">
    <option value="">${ph}</option>${o}</select>`;

  $('#pb').innerHTML = `

    <div class="kpis">
      <div class="kpi"><div class="n">${B.stats.total}</div><div class="l">Lượt khớp bộ lọc</div></div>
      <div class="kpi amb"><div class="n">${B.stats.running}</div><div class="l">Đang diễn ra</div></div>
      <div class="kpi red"><div class="n">${B.stats.over}</div><div class="l">Quá giờ</div></div>
      <div class="kpi"><div class="n">${B.stats.forgot}</div><div class="l">Quên bấm dừng</div></div>
    </div>

    <div class="fil">
      <div class="f"><label>Nhân viên</label>${sel('user_id',
        B.users.filter(u=>u.role==='staff').map(u=>`<option value="${u.id}"${mark('user_id',u.id)}>${esc(u.name)}</option>`).join(''),'Tất cả')}</div>
      <div class="f"><label>Hoạt động</label>${sel('type_code',
        B.types.map(t=>`<option value="${t.code}"${mark('type_code',t.code)}>${t.name}</option>`).join(''),'Tất cả')}</div>
      <div class="f"><label>Ca</label>${sel('shift',
        (B.shifts||[]).filter(c=>c.in_use!==false)
          .map(c=>`<option value="${c.code}"${mark('shift',c.code)}>${c.name}</option>`).join(''),'Tất cả ca')}</div>
      <div class="f"><label>Bộ phận</label>${sel('department',
        B.departments.map(d=>`<option${mark('department',d)}>${d}</option>`).join(''),'Tất cả')}</div>
      <div class="f"><label>Khu vực</label>${sel('location',
        ['VN','ARM'].map(x=>`<option${mark('location',x)}>${x}</option>`).join(''),'Tất cả')}</div>
      ${B.brands.length > 1 ? `<div class="f"><label>Brand</label>${sel('brand',
        B.brands.map(b=>`<option${mark('brand',b)}>${b}</option>`).join(''),'Tất cả')}</div>` : ''}
      <div class="f"><label>Từ ngày</label><input type="date" data-q="from" value="${boardQ.from}" onchange="qSet()"></div>
      <div class="f"><label>Đến ngày</label><input type="date" data-q="to" value="${boardQ.to}" onchange="qSet()"></div>
      <div class="f"><label>Chỉ xem</label>${sel('only',
        `<option value="active"${mark('only','active')}>Đang chạy + có vấn đề</option>`
        + `<option value="running"${mark('only','running')}>Đang chạy</option>`
        + `<option value="over"${mark('only','over')}>Quá giờ</option>`
        + `<option value="forgot"${mark('only','forgot')}>Quên bấm dừng</option>`,'Tất cả — kể cả đã xong')}</div>
      <button class="btn btn-sm" onclick="clearFil()">Xóa lọc</button>
    </div>

    <div class="tw"><table>
      <thead><tr><th class="wide">Nhân viên</th><th>Hoạt động</th><th>Bắt đầu</th><th>Kết thúc</th>
      <th>Thời lượng</th><th>Kết thúc bởi</th><th class="c">Ảnh</th><th>IP</th><th class="r">Xử lý</th></tr></thead>
      <tbody>${trs || '<tr><td colspan="8" class="empty">Chưa có hoạt động nào khớp bộ lọc.</td></tr>'}</tbody>
    </table></div>
    <div class="sub" style="margin-top:10px">${B.rows.length} bản ghi hiển thị</div>`;
}

function clearFil() {
  // Xóa lọc vẫn giữ chế độ gọn, không đổ hết việc đã xong ra bảng
  boardQ = Object.fromEntries(BOARD_KEYS.map(k => [k, k === 'only' ? 'active' : '']));
  load();
}

async function closeAct(id) {
  if (!confirm('Đóng hoạt động này ngay bây giờ?')) return;
  const r = await api('/api/admin/close/' + id, { method: 'POST' });
  toast(r.ok ? 'Đã đóng hộ' : 'Không đóng được', r.message || '', !!r.ok);
  load();
}

/* ---------- Nhân sự ---------- */
function linkOf(k) { return location.origin + '/k/' + k; }

/* Bộ lọc bảng nhân sự — giữ trong biến để vẽ lại không mất lựa chọn */
let uQ = { q: '', department: '', location: '', brand: '', ym: '' };

function uSet() {
  ['q', 'department', 'location', 'brand'].forEach(k => {
    const el = document.querySelector(`[data-u="${k}"]`);
    if (el) uQ[k] = el.value;
  });
  renderUsers();
}
function uSetMonth(v) { uQ.ym = v; load(); }     // đổi tháng phải hỏi lại máy chủ
function uClear() { uQ = { q: '', department: '', location: '', brand: '', ym: uQ.ym }; renderUsers(); }

function renderUsers() {
  const tất = B.users.filter(u => u.role === 'staff');
  const tìm = uQ.q.trim().toLowerCase();
  const staff = tất.filter(u =>
    (!tìm || (u.name || '').toLowerCase().includes(tìm)
          || (u.emp_code || '').toLowerCase().includes(tìm)
          || (u.key || '').toLowerCase().includes(tìm))
    && (!uQ.department || u.department === uQ.department)
    && (!uQ.location || u.location === uQ.location)
    && (!uQ.brand || u.brand === uQ.brand));
  const trs = staff.map(u => `<tr>
    <td class="wide"><div style="font-weight:600">${esc(u.name)}</div>
      <div style="margin-top:5px;display:inline-flex;gap:5px">
        <span class="pill">${u.department || '—'}</span>
        ${u.brand ? `<span class="pill pri">${u.brand}</span>` : ''}
        ${u.is_active ? '' : '<span class="pill red">Đã khóa</span>'}</div></td>
    <td><span class="pill mono">${u.emp_code || '—'}</span>
      <div style="margin-top:5px"><button class="btn btn-sm"
        onclick="setEmp(${u.id},'${esc(u.name).replace(/'/g, "\\'")}','${u.emp_code || ''}')">Đổi</button></div></td>
    <td><div class="keybox"><code>${u.key}</code>
      <button class="btn btn-sm" onclick="copyLink('${u.key}','${esc(u.name).replace(/'/g,"\\'")}')">Chép link</button></div></td>
    <td><select style="width:auto;min-width:104px" onchange="setHours(${u.id},this.value)">
        ${[6,7,7.5,8,9,10,11,12].map(h => `<option value="${h}" ${(+u.shift_hours || 8) === h ? 'selected' : ''}>${h} tiếng</option>`).join('')}
      </select>
      <div class="sub" style="margin-top:4px">ô lịch ghi 1 mốc giờ<br>thì cộng thêm bấy nhiêu</div></td>
    <td><select style="width:auto;min-width:92px" onchange="setLoc(${u.id},this.value)">
        <option value="VN" ${u.location === 'VN' ? 'selected' : ''}>VN</option>
        <option value="ARM" ${u.location === 'ARM' ? 'selected' : ''}>ARM</option>
      </select>
      <div class="sub" style="margin-top:4px">${u.timezone || ''}</div></td>
    <td>${u.work_days
      ? `<span class="pill pri">${u.work_days} ngày làm</span>`
        + (u.off_days ? `<div class="sub" style="margin-top:4px">${u.off_days} ngày xin nghỉ</div>` : '')
      : '<span class="pill red">chưa có lịch</span>'
        + (u.off_days ? `<div class="sub" style="margin-top:4px">${u.off_days} ngày xin nghỉ</div>` : '')}</td>
    <td>${u.has_key
      ? `<span class="pill pri"><span class="dot"></span>Đã đặt</span>
         <div class="sub" style="margin-top:4px">lương ${u.key_month || '—'}</div>`
      : '<span class="pill red">chưa đặt</span>'}
      <div style="margin-top:5px"><button class="btn btn-sm"
        onclick="setKey(${u.id},'${esc(u.name).replace(/'/g, "\\'")}')">${u.has_key ? 'Đổi mã' : 'Đặt mã'}</button></div></td>
    <td style="text-align:right;white-space:nowrap">
      <button class="btn btn-sm" onclick="post(${u.id},'rekey')">Cấp key mới</button>
      ${u.is_active
        ? `<button class="btn btn-red btn-sm" onclick="lockU(${u.id})">Khóa</button>`
        : `<button class="btn btn-sm" onclick="upd(${u.id},{is_active:1})">Mở</button>`}</td></tr>`).join('');

  const depOpts = B.departments.map(d => `<option>${d}</option>`).join('');
  const scoped = B.scope !== null && B.scope !== undefined;
  const brOpts = (scoped ? '' : '<option value="">—</option>') + B.brands.map(b => `<option>${b}</option>`).join('');

  $('#pu').innerHTML = `
    <div class="sec"><span class="t">Nhập lịch ca theo tháng</span><span class="rule"></span>
      <span class="r">mỗi ô một mốc giờ vào ca · DO / AL / trống là nghỉ</span></div>
    <div class="card card-p" style="margin-bottom:var(--s4)">
      <div class="row">
        <div class="f" style="max-width:170px"><label>Tháng áp dụng</label>
          <input type="month" id="schYm" value="${new Date().toISOString().slice(0, 7)}"></div>
        <div class="f"><label>File lịch</label><input type="file" id="schFile" accept=".xlsx,.xls,.csv"></div>
        <button class="btn" onclick="schImport('preview')">Xem trước</button>
        <button class="btn btn-pri" onclick="schImport('merge')">Merge</button>
        <button class="btn btn-red" onclick="schImport('replace')">Ghi đè tháng</button>
      </div>
      <div id="schOut" class="sub" style="margin-top:10px;line-height:1.6"></div>

        <span class="mono">2:00</span>, <span class="mono">23:00</span>) — giờ kết tính theo
        <b>độ dài ca</b> của người đó ở bảng dưới.
        Ghi <span class="mono">DO</span>, <span class="mono">AL</span>, <span class="mono">OFF</span>
        hoặc để trống là ngày nghỉ.<br>
        Cột định danh: <span class="mono">Ma</span> (mã 8 ký tự trong link) hoặc
        <span class="mono">Ten</span>. Các cột <span class="mono">KhuVuc</span>,
        <span class="mono">BoPhan</span>, <span class="mono">Brand</span>,
        <span class="mono">MaCaNhan</span>, <span class="mono">ThangLuong</span> là tuỳ chọn.
        Excel hay tự đổi tiêu đề <span class="mono">01/09</span>…<span class="mono">12/09</span>
        thành ngày kiểu Mỹ (9 tháng 1) — hệ thống tự nhận ra và sửa lại đúng.
        <b>Định dạng cột MaCaNhan thành Text</b>, nếu không Excel cắt mất số 0 đầu.<br>
        <b>Người chưa có trong hệ thống sẽ được tự tạo mới</b> theo tên trong file — không cần
        thêm tay trước. Nếu file thiếu cột Bộ phận/Brand cho người mới, vào bảng bên dưới
        sửa lại sau khi nhập.
      </div>
    </div>

    <div class="card card-p" style="margin-bottom:16px">
      <div style="font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--tx-3);margin-bottom:10px">
        Thêm một người thủ công — tách biệt với việc nhập lịch bằng file ở trên
      </div>

async function schImport(mode) {
  const f = $('#schFile').files[0];
  const ym = $('#schYm').value;
  if (!f) return toast('Chưa chọn file', 'Chọn file .xlsx hoặc .csv trước.', false);
  if (!ym) return toast('Chưa chọn tháng', 'Cần tháng áp dụng.', false);
  if (mode === 'replace' && !confirm(`Ghi đè toàn bộ lịch tháng ${ym}? Lịch cũ của MỌI người trong tháng này sẽ bị xoá.`)) return;

  const out = $('#schOut');
  out.textContent = 'Đang đọc file…';

  let res, r;
  try {
    res = await fetch(`/api/admin/schedule/import?ym=${ym}&mode=${mode}`, {
      method: 'POST', headers: { 'Content-Type': 'application/octet-stream' }, body: f,
    });
  } catch (e) {
    out.innerHTML = `<b style="color:var(--red)">Không gọi được máy chủ.</b> Kiểm tra kết nối rồi thử lại.`;
    return;
  }

  // Máy chủ trả về HTML thay vì JSON = route chưa tồn tại hoặc app lỗi.
  // Nói rõ mã lỗi thay vì gộp hết thành "lỗi mạng".
  const ctype = res.headers.get('content-type') || '';
  if (!ctype.includes('application/json')) {
    const why = res.status === 404
      ? 'Máy chủ chưa có chức năng nhập lịch — <b>server.js và schedule.js trên máy chủ chưa được cập nhật</b>. Đẩy đủ 3 file <span class="mono">server.js</span>, <span class="mono">schedule.js</span>, <span class="mono">package.json</span> rồi deploy lại.'
      : res.status === 413 ? 'File quá lớn (giới hạn 8MB). Xoá bớt sheet thừa hoặc lưu lại dạng .csv.'
      : res.status === 401 || res.status === 403 ? 'Phiên đăng nhập đã hết. Tải lại trang và đăng nhập lại.'
      : `Máy chủ trả về lỗi ${res.status}. Xem tab Logs trên Render để biết chi tiết.`;
    out.innerHTML = `<b style="color:var(--red)">Lỗi ${res.status}.</b> ${why}`;
    return;
  }

  r = await res.json().catch(() => ({ ok: false, message: 'Máy chủ trả về dữ liệu không đọc được.' }));

  if (!r.ok) {
    out.innerHTML = `<b style="color:var(--red)">${esc(r.message || 'Không đọc được file.')}</b>`
      + (r.errors && r.errors.length ? `<br>${r.errors.slice(0, 5).map(esc).join('<br>')}` : '');
    return;
  }

  const parts = [];
  if (r.preview) {
    if (r.warnings && r.warnings.length) {
      parts.push(`<div style="color:var(--red);font-weight:700;margin-top:6px">
        ${r.warnings.length} dòng trong file có ô không hợp lệ — sửa file rồi nhập lại:</div>
        <div class="sub" style="line-height:1.6">${r.warnings.slice(0, 8).map(esc).join('<br>')}
        ${r.warnings.length > 8 ? `<br>… và ${r.warnings.length - 8} dòng nữa` : ''}</div>`);
    }
    parts.push(`<b>Xem trước tháng ${r.ym}:</b> ${r.count} người · ${r.dayCount} ngày làm`
      + (r.keyCount ? ` · ${r.keyCount} mã cá nhân` : ' · không có mã cá nhân nào') + '.');
    if (r.matched.length) parts.push(`Đã có trong hệ thống: ${r.matched.slice(0, 10).map(esc).join(', ')}${r.matched.length > 10 ? '…' : ''}`);
    if (r.missing && r.missing.length)
      parts.push(`<b style="color:var(--amb)">Người mới, sẽ tự tạo khi bấm Merge/Ghi đè (${r.missing.length}):</b> ${r.missing.map(esc).join(', ')}`);
  } else {
    parts.push(`<b style="color:var(--pri)">${esc(r.message)}</b>`);
    toast('Đã áp lịch', r.message, true);
    if (r.created && r.created.length)
      parts.push(`<b style="color:var(--pri)">Đã tự tạo mới ${r.created.length} người:</b> ${r.created.map(esc).join(', ')} — kiểm tra lại Bộ phận/Brand của họ ở bảng dưới nếu file không có 2 cột đó.`);
  }
  if (r.errors && r.errors.length)
    parts.push(`<b style="color:var(--amb)">${r.errors.length} ô có vấn đề (đã coi là nghỉ):</b><br>${r.errors.slice(0, 6).map(esc).join('<br>')}${r.errors.length > 6 ? '<br>…' : ''}`);

  out.innerHTML = parts.join('<br>');
  if (!r.preview) load();
}

/* Chi tiết từng lượt điểm danh của một người — kèm nút xem ảnh xác nhận */
async function rcDetail(userId, name) {
  const modal = document.createElement('div');
  modal.className = 'cam-modal';
  modal.innerHTML = `<div class="cam-box" style="max-width:640px;width:min(640px,94vw)">
    <div class="cam-h"><span>Các lượt điểm danh của ${esc(name)}</span>
      <button class="x" id="rcClose">×</button></div>
    <div style="padding:var(--s4) var(--s5);max-height:70vh;overflow:auto" id="rcBody">
      <div class="empty">Đang tải…</div>
    </div>
  </div>`;
  document.body.appendChild(modal);
  modal.querySelector('#rcClose').onclick = () => modal.remove();
  modal.onclick = (e) => { if (e.target === modal) modal.remove(); };

  const STATUS_LABEL = {
    done: '<span class="pill pri">Đã điểm danh</span>',
    missed: '<span class="pill red">Vắng</span>',
    pending: '<span class="pill amb">Đang chờ</span>',
    waiting: '<span class="pill">Chờ dừng hoạt động</span>',
    deferred: '<span class="pill">Đã hoãn</span>',
    cancelled: '<span class="sub">Đã huỷ</span>',
  };

  let d;
  try {
    const r = await fetch(`/api/admin/rollcalls/detail?user_id=${userId}`);
    d = await r.json();
  } catch (e) {
    modal.querySelector('#rcBody').innerHTML = '<div class="empty">Không tải được dữ liệu.</div>';
    return;
  }
  const items = d.items || [];
  modal.querySelector('#rcBody').innerHTML = items.length
    ? `<div class="tw" style="border:none"><table>
        <thead><tr><th>Ngày</th><th>Tới hạn</th><th>Trả lời</th><th>Loại</th>
          <th>Trạng thái</th><th class="r">Ảnh</th></tr></thead>
        <tbody>${items.map(x => `<tr>
          <td class="sub">${x.day.split('-').reverse().join('/')}</td>
          <td class="sub mono">${x.due_at ? hms(x.due_at).slice(0, 5) : '—'}</td>
          <td class="sub mono">${x.answered_at ? hms(x.answered_at).slice(0, 5) : '—'}</td>
          <td>${x.source === 'manual' ? '<span class="pill blu">Thủ công</span>'
            : x.is_makeup ? '<span class="pill amb">Bù</span>' : '<span class="sub">Tự động</span>'}</td>
          <td>${STATUS_LABEL[x.status] || x.status}
            ${x.defer_reason ? `<div class="sub">${esc(x.defer_reason)}</div>` : ''}</td>
          <td class="r">${x.photo_id || x.screen_id ? `
            ${x.photo_id ? `<button class="btn btn-sm" onclick="viewPhoto('rollcall',${x.photo_id})">Ảnh chụp</button>` : ''}
            ${x.screen_id ? `<button class="btn btn-sm" onclick="viewPhoto('rollcall',${x.screen_id},'screen')">Màn hình</button>` : ''}`
            : '<span class="sub">—</span>'}</td>
        </tr>`).join('')}</tbody>
      </table></div>`
    : '<div class="empty">Chưa có lượt điểm danh nào.</div>';
}

      <button class="x" id="phClose">×</button></div>
    <div class="cam-view" id="phView" style="aspect-ratio:${only === 'screen' ? '16/10' : '1/1'}">
      <img src="/api/admin/photo/${table}/${id}${only === 'screen' ? '?kind=screen' : ''}" style="width:100%;height:100%;object-fit:contain;background:#0C1613"
        onerror="this.parentElement.innerHTML='<div class=&quot;cam-err&quot;>Không tải được ảnh — có thể đã bị xoá.</div>'">
    </div>
  </div>`;
  document.body.appendChild(modal);

  // Chuyển giữa ảnh chụp và ảnh màn hình
  modal.querySelectorAll('[data-ph]').forEach((b) => {
    b.onclick = () => {
      modal.querySelectorAll('[data-ph]').forEach((x) => x.classList.toggle('on', x === b));
      const kind = b.dataset.ph;
      const view = modal.querySelector('#phView');
      view.style.aspectRatio = kind === 'screen' ? '16/10' : '1/1';
      view.innerHTML = `<img src="/api/admin/photo/${table}/${id}${kind === 'screen' ? '?kind=screen' : ''}"
        style="width:100%;height:100%;object-fit:contain;background:#0C1613"
        onerror="this.parentElement.innerHTML='<div class=&quot;cam-err&quot;>`
        + (kind === 'screen'
            ? 'Lượt này không có ảnh màn hình — nhân viên bấm từ điện thoại.'
            : 'Không tải được ảnh.')
        + `</div>'">`;
    };
  });

  modal.querySelector('#phClose').onclick = () => modal.remove();
  modal.onclick = (e) => { if (e.target === modal) modal.remove(); };
}

async function fireRollCall() {
  const who = $('#fireWho').value;
  const win = +$('#fireWin').value;
  if (!confirm('Bắn điểm danh ngay bây giờ? Ai không xác nhận trong ' + win + ' phút sẽ bị tính vắng.')) return;
  const r = await api('/api/admin/rollcalls/fire', { method: 'POST', body: { who, window_min: win } });
  toast(r.ok ? 'Đã bắn' : 'Không bắn được', r.message || '', !!r.ok);
  loadRollCalls();
}

async function forceOut() {
  const sel = $('#outWho');
  if (!sel) return;

  const id = sel.value;
  if (!id) {
    toast('Chưa chọn nhân viên', 'Chọn nhân viên trước khi cho xuống ca.', false);
    return;
  }

  const name = sel.options[sel.selectedIndex].text;
  if (!confirm(`Cho ${name} xuống ca ngay bây giờ? Các lượt điểm danh còn lại của ca sẽ bị huỷ.`)) return;

  const r = await api(`/api/admin/users/${id}/punch-out`, { method: 'POST' });
  toast(r.ok ? 'Đã cho xuống ca' : 'Không thực hiện được', r.message || '', !!r.ok);

  if (r.ok) {
    sel.value = '';
    loadRollCalls();
  }
}

/* Lượt điểm danh sắp tới — biết trước tới lượt ai, khỏi ngồi đoán */
function upcomingBox(d) {
  const up = d.upcoming || [];
  if (!up.length) return `<div class="card card-p" style="margin-bottom:16px">
    <div class="sub">Chưa có lượt điểm danh nào được lên lịch.
    Kiểm tra đã nhập lịch ca tháng này chưa — không có lịch ca thì không sinh được điểm danh.</div></div>`;

  const nhãn = { active: ['red', 'ĐANG CHỜ TRẢ LỜI'], soon: ['amb', 'Sắp tới'],
                 waiting: ['', 'Chờ dừng hoạt động'], scheduled: ['', 'Đã lên lịch'] };

  const rows = up.slice(0, 12).map(x => {
    const [cls, txt] = nhãn[x.state] || ['', ''];
    const khi = x.state === 'waiting' ? '—'
      : x.state === 'active' ? 'ngay bây giờ'
      : x.in_seconds > 0
        ? (x.in_seconds < 3600 ? `sau ${Math.ceil(x.in_seconds / 60)} phút` : hms(x.due_at))
        : hms(x.due_at);
    return `<tr class="${x.state === 'active' ? 'row-alert' : ''}">
      <td class="wide"><b>${esc(x.user_name)}</b>
        <span class="sub"> · ${x.emp_code || '—'} · ${x.department || '—'}${x.brand ? ' · ' + x.brand : ''}</span></td>
      <td>${x.due_at ? hms(x.due_at) : '—'}</td>
      <td>${khi}</td>
      <td>${x.source === 'manual'
        ? '<span class="pill blu">Thủ công</span>'
        : x.is_makeup ? '<span class="pill amb">Bù</span>' : '<span class="sub">Tự động</span>'}</td>
      <td class="r">${txt ? `<span class="pill ${cls}">${txt}</span>` : ''}</td>
    </tr>`;
  }).join('');

  const đangChờ = up.filter(x => x.state === 'active').length;

  return `<div class="card" style="margin-bottom:16px">
    <div class="card-h"><span class="t">Lượt sắp tới</span>
      <span class="r">${up.length} lượt đang chờ trong hàng đợi${
        đangChờ ? ` · <b style="color:var(--red)">${đangChờ} đang phải trả lời ngay</b>` : ''}</span></div>
    <div class="tw" style="border:none;box-shadow:none"><table>
      <thead><tr><th class="wide">Nhân viên</th><th>Giờ bắn</th><th>Còn</th>
        <th>Loại</th><th class="r">Trạng thái</th></tr></thead>
      <tbody>${rows}</tbody></table></div>
    ${up.length > 12 ? `<div class="sub" style="padding:0 18px 14px">và ${up.length - 12} lượt nữa</div>` : ''}
  </div>`;
}

/* ---------- Tuân thủ báo cáo ---------- */
let repDays = 14, repCfg = { depts: [] };
let repQ = { q: '', user_id: '', department: '', brand: '', location: '' };

function repSet() {
  ['q', 'user_id', 'department', 'brand', 'location'].forEach(k => {
    const el = document.querySelector(`[data-rp="${k}"]`);
    if (el) repQ[k] = el.value;
  });
  loadReports();
}
function repClear() {
  repQ = { q: '', user_id: '', department: '', brand: '', location: '' };
  loadReports();
}

async function loadReports(refresh) {
  $('#prp').innerHTML = '<div class="empty">Đang đọc Google Sheets…</div>';
  const qs = new URLSearchParams({ days: repDays, ...repQ });
  if (refresh) qs.set('refresh', '1');
  const r = await fetch('/api/admin/reports?' + qs);
  if (r.status !== 200) { $('#prp').innerHTML = '<div class="empty">Không xem được mục này.</div>'; return; }
  const d = await r.json();
  repCfg = d.config || { depts: [] };

  const sh = d.sheet;
  const dsFile = (sh.sheets || []).map(x => `
    <div class="shrow ${x.error ? 'bad' : 'ok'}">
      <span class="d"></span>
      <b>${esc(x.name)}</b>
      <span class="sub">tab ${esc(x.tab)} · ${x.id_short}</span>
      <span class="sp"></span>
      ${x.error ? `<span class="pill red">${esc(x.error)}</span>`
                : `<span class="pill pri">${x.rows} dòng</span>`
                  + (x.grid_rows ? `<span class="sub"> / ${x.grid_rows} dòng trong file</span>` : '')
                  + (x.warn ? `<span class="pill amb">${esc(x.warn)}</span>` : '')}
    </div>`).join('');

  const shBox = !sh.configured
    ? `<div class="card card-p" style="margin-bottom:16px;background:var(--red-s);border-color:var(--red-l)">
        <b style="color:var(--red)">Chưa khai file báo cáo nào</b>
        <div class="sub" style="margin-top:6px;line-height:1.6">
          Thêm biến <span class="mono">REPORT_SHEETS</span> trên Render, mỗi dòng một file:<br>
          <span class="mono">Tên hiển thị | spreadsheetId | Tên tab</span></div></div>`
    : `<div class="card card-p" style="margin-bottom:16px;background:#FAFBFB">
        <div class="sub" style="line-height:1.7;margin-bottom:10px">
          Đọc <b>${sh.count}</b> file, tổng <b>${sh.rows}</b> dòng,
          làm mới lúc ${sh.fetched_at ? hms(sh.fetched_at) : '—'} (mỗi ${sh.ttl_min} phút).<br>
          Có dòng ở <b>bất kỳ file nào</b> trong ngày là tính đã điền.
          Nợ từ <b>${d.config.block_after}</b> ca thì không vào ca mới được,
          từ <b>${d.config.alert_after}</b> ca thì cảnh báo khóa BO.
        </div>
        ${dsFile}
        ${sh.error ? `<div class="sub" style="margin-top:10px;color:var(--red)">
          <b>Mọi file đều lỗi — hệ thống không chặn ai cả</b>, thà bỏ sót còn hơn khóa nhầm cả team.</div>` : ''}
      </div>`;

  const cell = (c) => {
    const cls = c.state === 'done' ? 'ok' : c.state === 'exempt' ? 'ex' : 'miss';
    const [y, m, dd] = c.day.split('-');
    const ti = `${dd}/${m}/${y}${c.is_today ? ' (hôm nay)' : ''} — ` +
      (c.state === 'done' ? `${c.rows} dòng` : c.state === 'exempt' ? 'được miễn' : 'chưa điền');
    return `<i class="gcell ${cls} ${c.is_today ? 'today' : ''}" title="${ti}"><b>${+dd}</b></i>`;
  };

  const trs = d.rows.map(x => `<tr class="${x.alert ? 'row-alert' : ''}">
    <td class="wide"><div style="font-weight:600">${esc(x.name)}</div>
      <div style="margin-top:5px;display:inline-flex;gap:5px;align-items:center">
        <span class="pill mono">${x.emp_code}</span>
        <span class="pill">${x.department || '—'}</span>
        ${x.brand ? `<span class="pill pri">${x.brand}</span>` : ''}</div></td>
    <td>${x.cells.length
      ? `<div class="grid14">${x.cells.map(cell).join('')}</div>
         <div class="sub" style="margin-top:4px">số trong ô là ngày · cũ → mới · ô viền vàng là hôm nay</div>`
      : '<span class="sub">Chưa có ca nào trong lịch — nhập lịch ca tháng ở tab Nhân sự</span>'}</td>
    <td class="c">${x.today_exempt
      ? '<span class="pill">miễn</span>'
      : x.today_rows ? `<span class="pill pri">${x.today_rows} dòng</span>`
                     : '<span class="pill red">chưa có</span>'}</td>
    <td class="c">${x.owing
      ? `<span class="pill ${x.alert ? 'red' : 'amb'}">${x.owing} ca</span>`
      : '<span class="pill pri">không nợ</span>'}</td>
    <td class="c">${x.alert
      ? '<span class="pill red">Cảnh báo khóa BO</span>'
      : x.blocked ? '<span class="pill amb">Chặn vào ca</span>'

    <td class="r">${x.owing_days.length
      ? `<button class="btn btn-sm" onclick="exemptDay(${x.id},'${x.owing_days[0]}','${esc(x.name).replace(/'/g, "\\'")}')">Miễn ca cũ nhất</button>`

  $('#prp').innerHTML = `
    ${shBox}
    <div class="card card-p" style="margin-bottom:var(--s4)">
      <div style="font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--tx-3);margin-bottom:var(--s3)">
        Áp dụng theo dõi báo cáo cho bộ phận</div>
      <div class="checks">
        ${d.departments.map(x => {
          const on = d.config.depts.includes(x);
          return `<label class="check ${on ? 'on' : ''}">
            <input type="checkbox" ${on ? 'checked' : ''} onchange="toggleReportDept('${x}')">
            <span class="box">${on ? '✓' : ''}</span>
            <span class="lb">${x}</span>
          </label>`;
        }).join('')}
      </div>
      <div class="sub" style="margin-top:var(--s3);line-height:1.6">
        Bộ phận không bật thì <b>không bị tính nợ và không bị chặn ca</b>.
        Bật lại lúc nào cũng được, có hiệu lực ngay không cần deploy.
      </div>
    </div>

    <div class="kpis">
      <div class="kpi"><div class="n">${d.stats.total}</div><div class="l">Nhân viên</div></div>
      <div class="kpi amb"><div class="n">${d.stats.owing}</div><div class="l">Đang nợ</div></div>
      <div class="kpi red"><div class="n">${d.stats.blocked}</div><div class="l">Bị chặn vào ca</div></div>
      <div class="kpi red"><div class="n">${d.stats.alert}</div><div class="l">Chạm ngưỡng khóa BO</div></div>
    </div>
    <div class="fil">
      <div class="f" style="min-width:200px"><label>Tìm tên / mã NV</label>
        <input data-rp="q" value="${esc(repQ.q)}" placeholder="gõ để lọc…" oninput="repSet()"></div>
      <div class="f"><label>Nhân viên</label>
        <select data-rp="user_id" onchange="repSet()"><option value="">Tất cả</option>
          ${(d.users || []).map(u => `<option value="${u.id}" ${repQ.user_id == u.id ? 'selected' : ''}>${esc(u.name)}</option>`).join('')}
        </select></div>
      <div class="f"><label>Bộ phận</label>
        <select data-rp="department" onchange="repSet()"><option value="">Tất cả</option>
          ${(d.config.depts || []).map(x => `<option ${repQ.department === x ? 'selected' : ''}>${x}</option>`).join('')}
        </select></div>
      <div class="f"><label>Khu vực</label>
        <select data-rp="location" onchange="repSet()"><option value="">Tất cả</option>
          ${(d.locations || ['VN', 'ARM']).map(x => `<option ${repQ.location === x ? 'selected' : ''}>${x}</option>`).join('')}
        </select></div>
      ${d.brands.length > 1 ? `<div class="f"><label>Brand</label>
        <select data-rp="brand" onchange="repSet()"><option value="">Tất cả</option>
          ${d.brands.map(x => `<option ${repQ.brand === x ? 'selected' : ''}>${x}</option>`).join('')}
        </select></div>` : ''}
      <div class="f"><label>Số ngày nhìn lại</label>
        <select onchange="repDays=+this.value;loadReports()">
          ${[7, 14, 21, 31].map(n => `<option value="${n}" ${repDays === n ? 'selected' : ''}>${n} ngày</option>`).join('')}
        </select></div>
      <button class="btn btn-sm" onclick="repClear()">Xóa lọc</button>
      <button class="btn btn-sm" onclick="loadReports(true)">Đọc lại sheet ngay</button>
      <button class="btn btn-sm" onclick="soiSheet()">Soi sheet hôm nay</button>
      <div class="legend">
        <span><i class="gcell ok"></i>đã điền</span>
        <span><i class="gcell ex"></i>được miễn</span>
        <span><i class="gcell miss"></i>chưa điền</span>

    </div>
    <div class="tw"><table>
      <thead><tr><th class="wide">Nhân viên</th><th>Lịch sử ${repDays} ca gần nhất</th>

/* Hiện đúng những gì hệ thống đọc được trong sheet — dùng khi nhân viên bảo
   đã điền mà bảng vẫn báo nợ. Nhìn là biết lệch mã hay lệch ngày. */
async function soiSheet() {
  const hom = prompt('Soi ngày nào? (YYYY-MM-DD)', new Date().toISOString().slice(0, 10));
  if (!hom) return;
  const d = await fetch(`/api/admin/reports/inspect?day=${hom}&refresh=1`).then(r => r.json());

  const modal = document.createElement('div');
  modal.className = 'cam-modal';
  modal.innerHTML = `<div class="cam-box" style="max-width:min(700px,94vw)">
    <div class="cam-h"><span>Sheet đọc được gì ngày ${d.day}</span>
      <button class="x" id="soiX">×</button></div>
    <div style="padding:var(--s5);max-height:70vh;overflow:auto">
      <div class="sub" style="margin-bottom:var(--s4);line-height:1.7">
        Tổng <b>${d.total_rows}</b> dòng trong 3 file · ngày này có <b>${d.rows_today}</b> dòng.
        ${d.error ? `<br><span style="color:var(--red)">${esc(d.error)}</span>` : ''}
      </div>

      <div class="sec"><span class="t">Mã NV đọc được ngày này</span><span class="rule"></span></div>
      ${d.codes.length ? `<div class="tw"><table><thead><tr><th>Mã NV</th><th class="c">Số dòng</th><th>Ở file nào</th></tr></thead>
        <tbody>${d.codes.map(c => `<tr><td class="mono">${esc(c.code)}</td><td class="c">${c.count}</td>
          <td class="sub">${Object.entries(c.sources).map(([k, v]) => esc(k) + ': ' + v).join(' · ')}</td></tr>`).join('')}
        </tbody></table></div>`
        : '<div class="empty">Không có dòng nào mang ngày này.</div>'}

      <div class="sec"><span class="t">Các ngày gần nhất trong sheet</span><span class="rule"></span></div>
      <div class="chips-like sub" style="line-height:2">
        ${d.recent_days.map(x => `<span class="pill ${x.day === d.day ? 'pri' : ''}">${x.day} · ${x.rows} dòng</span>`).join(' ')}
      </div>

      <div class="sub" style="margin-top:var(--s4);line-height:1.7">
        Mã cần tìm không có trong bảng trên nghĩa là <b>cột MaNV trong sheet ghi khác</b>
        với mã trong hệ thống, hoặc <b>cột Ngày của dòng đó không phải ngày này</b>.
      </div>
    </div></div>`;
  document.body.appendChild(modal);
  modal.querySelector('#soiX').onclick = () => modal.remove();
  modal.onclick = (e) => { if (e.target === modal) modal.remove(); };
}

async function toggleReportDept(dept) {
  const cur = (repCfg.depts || []).slice();
  const i = cur.indexOf(dept);
  if (i >= 0) cur.splice(i, 1); else cur.push(dept);
  const r = await api('/api/admin/report-depts', { method: 'POST', body: { depts: cur } });
  toast(r.ok ? 'Đã cập nhật' : 'Không đổi được', r.message || '', !!r.ok);
  loadReports(true);
}

async function exemptDay(userId, day, name) {
  const lý = prompt(`Miễn báo cáo ca ${day.split('-').reverse().join('/')} cho ${name}?\n\nLý do:`);
  if (!lý) return;
  const r = await api('/api/admin/reports/exempt', { method: 'POST', body: { user_id: userId, day, reason: lý } });
  toast(r.ok ? 'Đã miễn' : 'Không miễn được', r.message || '', !!r.ok);
  loadReports(true);
}

/* ---------- Khung ---------- */
/* ---------- Bộ lọc dùng chung cho tab Chấm công / Trễ ---------- */
const PUNCH_KEYS = ['user_id','kind','department','brand','location','shift','from','to','late_level'];
let punchQ = Object.fromEntries(PUNCH_KEYS.map(k => [k, '']));

function pRead() {
  PUNCH_KEYS.forEach(k => {
    const el = document.querySelector(`[data-p="${k}"]`);
    if (el) punchQ[k] = el.value;
  });
}
function pSet(mode) {
  pRead();
  if (mode === 'rc') loadRollCalls();
  else if (mode === 'sl') loadShiftLog();
  else loadLate();
}
function qp() {
  const p = new URLSearchParams();
  PUNCH_KEYS.forEach(k => { if (punchQ[k]) p.set(k, punchQ[k]); });
  return p.toString();
}

const KIND_PILL = { in: 'pri', out: 'amb', log: '' };

/* Thanh lọc dùng chung cho hai tab, chỉ khác một ô ở giữa */
function punchFilters(d, mode) {
  const fn = `pSet('${mode}')`;
  const mark = (k, v) => punchQ[k] === String(v) ? ' selected' : '';
  const sel = (k, o, ph) => `<select data-p="${k}" onchange="${fn}">
    <option value="">${ph}</option>${o}</select>`;

  return `<div class="fil">
    ${d.is_admin ? `<div class="f"><label>Nhân viên</label>${sel('user_id',
      d.users.map(u => `<option value="${u.id}"${mark('user_id', u.id)}>${esc(u.name)}</option>`).join(''), 'Tất cả')}</div>` : ''}
    ${mode === 'rc' ? ''
      : mode === 'late'
      ? `<div class="f"><label>Mức trễ</label>${sel('late_level',
          Object.entries(d.levels).map(([k, v]) => `<option value="${k}"${mark('late_level', k)}>${v.label}</option>`).join(''), 'Tất cả')}</div>`
      : `<div class="f"><label>Loại</label>${sel('kind',
          Object.entries(d.kinds).map(([k, v]) => `<option value="${k}"${mark('kind', k)}>${v}</option>`).join(''), 'Tất cả')}</div>`}
    <div class="f"><label>Ca</label>${sel('shift',
      (d.shifts || []).filter(c => c.in_use !== false)
        .map(c => `<option value="${c.code}"${mark('shift', c.code)}>${c.name}</option>`).join(''), 'Tất cả ca')}</div>
    <div class="f"><label>Bộ phận</label>${sel('department',
      d.departments.map(x => `<option${mark('department', x)}>${x}</option>`).join(''), 'Tất cả')}</div>
    <div class="f"><label>Khu vực</label>${sel('location',
      ['VN', 'ARM'].map(x => `<option${mark('location', x)}>${x}</option>`).join(''), 'Tất cả')}</div>
    ${d.brands.length > 1 ? `<div class="f"><label>Brand</label>${sel('brand',
      d.brands.map(x => `<option${mark('brand', x)}>${x}</option>`).join(''), 'Tất cả')}</div>` : ''}
    <div class="f"><label>Từ ngày</label><input type="date" data-p="from" value="${punchQ.from}" onchange="${fn}"></div>
    <div class="f"><label>Đến ngày</label><input type="date" data-p="to" value="${punchQ.to}" onchange="${fn}"></div>
    <button class="btn btn-sm" onclick="clearP('${mode}')">Xóa lọc</button>
  </div>`;
}

  const trs = d.rows.map(r => `<tr>

  punchQ = Object.fromEntries(PUNCH_KEYS.map(k => [k, '']));

  const d = await r.json();

  const gio = t => t ? hms(t).slice(0, 5) : '<span class="sub">—</span>';

    ? `<span class="pill ${lv === 'in5' ? 'amb' : 'red'}">${min} phút</span>`

  const trs = d.rows.map(x => `<tr class="${x.missing_out ? 'row-alert' : ''}">

    <td class="c mono">${x.out_at ? gio(x.out_at) + (x.qua_dem ? ' <span class="pill">+1</span>' : '')
      : x.in_progress ? '<span class="pill pri"><span class="dot"></span>đang trực</span>'
      : '<span class="pill red">quên bấm ra</span>'}</td>
    <td class="c">${x.out_at ? treBadge(x.out_late, x.out_late_min) : '<span class="sub">—</span>'}</td>
    <td class="c">${x.duration_min != null
      ? `${x.in_progress ? '~' : ''}${Math.floor(x.duration_min / 60)}h${String(x.duration_min % 60).padStart(2, '0')}`

    <div class="card card-p" style="margin-bottom:var(--s4);background:var(--card-2)">
      <div class="sub" style="line-height:1.7">
        Mỗi dòng là một ca của một người: giờ vào, giờ ra, có trễ hay không.
        ${d.early_min > 0
          ? `Phải lên ca <b>trước giờ ca ${d.early_min} phút</b> — quá mốc đó dù 1 phút cũng tính là trễ.`
          : 'Mốc tính trễ là <b>đúng giờ ca</b> — quá 1 phút là trễ 1 phút, trễ bao nhiêu ghi bấy nhiêu.'}
      </div></div>

/* ---------- Tab Trễ: ai trễ nhiều, không phải nhật ký từng lượt ---------- */
function lateTable(d) {
  const bar = (n, total) => total ? Math.round((n / total) * 100) : 0;
  const worst = Math.max(1, ...d.rows.map(r => r.total_minutes));

  const trs = d.rows.map((r, i) => `<tr>
    <td style="text-align:center;color:var(--tx-3);font-weight:700">${i + 1}</td>
    <td class="wide"><div style="font-weight:600">${esc(r.user_name)}</div>
      <div style="margin-top:5px;display:inline-flex;gap:5px">
        <span class="pill">${r.department || '—'}</span>
        ${r.brand ? `<span class="pill pri">${r.brand}</span>` : ''}</div></td>
    <td class="c">${r.in5 ? `<span class="pill amb">${r.in5}</span>` : '<span class="sub">—</span>'}</td>
    <td class="c">${r.in30 ? `<span class="pill red">${r.in30}</span>` : '<span class="sub">—</span>'}</td>
    <td class="c">${r.out60 ? `<span class="pill red">${r.out60}</span>` : '<span class="sub">—</span>'}</td>
    <td style="text-align:center;font-weight:700">${r.times}</td>
    <td style="min-width:150px">
      <div style="font-weight:700">${r.total_minutes} phút</div>
      <div class="lbar"><i style="width:${bar(r.total_minutes, worst)}%"></i></div>
      <div class="sub">lần nặng nhất ${r.worst_minutes} phút</div></td>
    <td class="sub">${dmy(r.last_at)}</td>
    <td class="r"><button class="btn btn-sm" onclick="lateDetail(${r.id},'${esc(r.user_name).replace(/'/g, "\\'")}')">Xem lượt</button></td>
  </tr>`).join('');

  return `
    <div class="kpis">
      <div class="kpi red"><div class="n">${d.stats.people}</div><div class="l">Nhân viên có trễ</div></div>
      <div class="kpi"><div class="n">${d.stats.times}</div><div class="l">Tổng lượt trễ</div></div>
      <div class="kpi amb"><div class="n">${d.stats.minutes}</div><div class="l">Tổng số phút trễ</div></div>
      <div class="kpi red"><div class="n">${d.stats.heavy}</div><div class="l">Lượt trễ nặng</div></div>
    </div>
    ${punchFilters(d, 'late')}
    <div class="tw"><table>
      <thead><tr><th style="width:40px;text-align:center">#</th><th class="wide">Nhân viên</th>
        <th class="c">~5p</th><th class="c">~30p</th>
        <th class="c">Xuống ca</th><th class="c">Tổng lượt</th>
        <th>Tổng phút trễ</th><th>Gần nhất</th><th></th></tr></thead>
      <tbody>${trs || '<tr><td colspan="9" class="empty">Không có ai trễ theo bộ lọc này.</td></tr>'}</tbody>
    </table></div>
    <div class="sub" style="margin-top:10px">Xếp theo mức nghiêm trọng: trễ nặng trước, rồi tới tổng số phút</div>`;
}

async function lateDetail(userId, name) {
  $('#pl').innerHTML = '<div class="empty">Đang tải…</div>';

  const p = new URLSearchParams(qp());
  p.set('detail', '1'); p.set('user_id', userId);

  let d;
  try {
    const r = await fetch('/api/late?' + p);
    if (r.status === 401) return location.reload();
    d = await r.json();
  } catch (e) {
    $('#pl').innerHTML = '<div class="empty">Không tải được dữ liệu.</div>';
    return;
  }

  const rows = d.rows || [];
  const trs = rows.map(r => `<tr>
    <td>${dmy(r.actual_at)}
      ${r.shift_day && r.shift_day !== isoDay(r.actual_at)
        ? `<div class="sub">ca ${r.shift_day.split('-').reverse().slice(0,2).join('/')}</div>` : ''}</td>
    <td class="mono">${hms(r.actual_at)}</td>
    <td><span class="pill ${KIND_PILL[r.kind] || ''}">${r.kind_label}</span></td>
    <td class="sub mono">${r.scheduled_at ? hms(r.scheduled_at) : '—'}</td>
    <td><span class="pill ${r.late_level === 'in5' ? 'amb' : 'red'}">${r.late_label || '—'}</span></td>
    <td style="text-align:right;font-weight:700">${r.late_minutes} phút</td>
    <td class="sub">${r.department || '—'}${r.brand ? ' · ' + r.brand : ''}</td>
    <td class="sub">${r.ip || '—'}</td>
    <td>${r.photo_id
      ? `<button class="btn btn-sm" onclick="viewPhoto('punch',${r.photo_id})">Xem ảnh</button>`
      : '<span class="sub">—</span>'}</td>
  </tr>`).join('');

  const tổngPhút = rows.reduce((n, r) => n + (r.late_minutes || 0), 0);

  $('#pl').innerHTML = `
    <div class="page-head" style="margin-bottom:14px">
      <div><h1 style="font-size:19px">Các lượt trễ của ${esc(name)}</h1>
        <p>${rows.length} lượt · tổng ${tổngPhút} phút trễ</p></div>
      <div class="sp"><button class="btn btn-sm" onclick="loadLate()">← Về danh sách</button></div>
    </div>
    <div class="tw"><table>
      <thead><tr><th>Ngày</th><th>Giờ bấm</th><th>Loại</th><th>Theo lịch</th>
        <th>Mức trễ</th><th class="r">Trễ</th><th>Bộ phận</th><th>IP</th><th>Ảnh</th></tr></thead>
      <tbody>${trs || '<tr><td colspan="9" class="empty">Không có lượt trễ nào khớp bộ lọc.</td></tr>'}</tbody>
    </table></div>`;
}




async function loadLate() {
  const r = await fetch('/api/late?' + qp());
  if (r.status === 401) return location.reload();
  const d = await r.json();
  $('#pl').innerHTML = d.detail ? punchTable(d, true) : lateTable(d);
}

      <div class="sub" style="line-height:1.7">
        <b style="color:var(--ink)">Quy trình:</b>
        ① nhân viên đăng ký nguyện vọng nghỉ →
        ② quản lý xem bảng này rồi xếp ca →
        ③ nhập file lịch ở tab Nhân sự →
        ④ khóa tháng để chốt.<br>
        Cột <b>Đối chiếu lịch</b> so nguyện vọng với lịch đã nhập:
        ngày nào xin nghỉ mà lịch vẫn xếp ca thì hiện đỏ${d.has_schedule ? ''
          : ' — hiện chưa nhập lịch tháng này nên chưa đối chiếu được'}.
      </div>
    </div>
    <div class="fil">
      <div class="f"><label>Nhân viên</label>
        <select data-o="user_id" onchange="offSet()"><option value="">Tất cả</option>
          ${d.users.map(u => `<option value="${u.id}" ${offQ.user_id == u.id ? 'selected' : ''}>${esc(u.name)}</option>`).join('')}
        </select></div>
      <div class="f"><label>Bộ phận</label>
        <select data-o="department" onchange="offSet()"><option value="">Tất cả</option>
          ${d.departments.map(x => `<option ${offQ.department === x ? 'selected' : ''}>${x}</option>`).join('')}
        </select></div>
      <div class="f"><label>Brand</label>
        <select data-o="brand" onchange="offSet()"><option value="">Tất cả</option>
          ${d.brands.map(x => `<option ${offQ.brand === x ? 'selected' : ''}>${x}</option>`).join('')}
        </select></div>
      <div class="f" style="min-width:168px"><label>Trạng thái</label>
        <select data-o="filter" onchange="offSet()">
          <option value="">Tất cả · ${d.counts.all}</option>
          <option value="none" ${offQ.filter === 'none' ? 'selected' : ''}>Chưa đăng ký · ${d.counts.none}</option>
          <option value="partial" ${offQ.filter === 'partial' ? 'selected' : ''}>Chưa đủ ${d.max} ngày · ${d.counts.partial}</option>
          <option value="full" ${offQ.filter === 'full' ? 'selected' : ''}>Đủ ${d.max} ngày · ${d.counts.full}</option>
          ${d.has_schedule ? `<option value="conflict" ${offQ.filter === 'conflict' ? 'selected' : ''}>Chưa đáp ứng nguyện vọng · ${d.counts.conflict}</option>` : ''}
        </select></div>
      <div class="f" style="min-width:150px"><label>Số ngày đã đăng ký</label>
        <select data-o="filter2" onchange="offSetDays(this.value)">
          <option value="">Tất cả</option>
          ${d.counts.byDays.map((n, i) => `<option value="${i + 1}" ${offQ.filter == String(i + 1) ? 'selected' : ''}
            ${n ? '' : 'disabled'}>${i + 1} ngày · ${n} người</option>`).join('')}
        </select></div>
      <button class="btn btn-sm" onclick="offClear()">Xóa lọc</button>
    </div>
    <div class="tw"><table>
      <thead><tr><th class="wide">Nhân viên</th><th>Đăng ký</th><th class="wide">Ngày xin nghỉ</th>
        <th>Đối chiếu lịch</th><th class="r">Xử lý</th></tr></thead>
      <tbody>${trs || '<tr><td colspan="5" class="empty">Không có ai khớp bộ lọc.</td></tr>'}</tbody>
    </table></div>
    <div class="sub" style="margin-top:10px">${d.rows.length} nhân viên</div>`;
}

function offMove(delta) {
  const [y, m] = offYm.split('-').map(Number);
  const d = new Date(y, m - 1 + delta, 1);
  offYm = `${d.getFullYear()}-${pad(d.getMonth() + 1)}`;
  loadOffs();
}

async function offLock(locked) {
  if (!confirm(locked ? `Khóa lịch off tháng ${offYm}? Nhân viên sẽ không tự sửa được.`
                      : `Mở khóa tháng ${offYm}?`)) return;
  const r = await api('/api/admin/offs/lock', { method: 'POST', body: { ym: offYm, locked } });
  toast(r.ok ? 'Đã cập nhật' : 'Không cập nhật được', r.message || '', !!r.ok);
  loadOffs();
}

async function admToggle(userId, day) {
  const r = await api('/api/admin/offs/toggle', { method: 'POST', body: { user_id: userId, day } });
  toast(r.ok ? 'Đã cập nhật' : 'Không cập nhật được', r.message || '', !!r.ok);
  loadOffs();
}

async function admAdd(userId, name) {
  const d = prompt(`Thêm ngày nghỉ cho ${name} (dạng ngày, ví dụ 15):`);
  if (!d) return;
  const day = `${offYm}-${pad(+d)}`;
  admToggle(userId, day);
}

const PANES = { b:['tb','pb'], sl:['tsl','psl'], l:['tl','pl'], o:['to','po'], r:['tr','pr'], rp:['trp','prp'], u:['tu','pu'], m:['tm','pm'] };
let rcTimer = null, bTimer = null;
function startRcTimer() {
  clearInterval(rcTimer);
  rcTimer = setInterval(() => { if (TAB === 'r') loadRollCalls(); }, 30000);
}
/* Tab Theo dõi phải bắt kịp lúc nhân viên vừa bấm đi — 12 giây một lần */
function startBoardTimer() {
  clearInterval(bTimer);
  bTimer = setInterval(() => { if (TAB === 'b' && !document.hidden) load(); }, 12000);
}

const TAB_META = {
  b:['Theo dõi hoạt động','Tình trạng hoạt động, ca làm và các vấn đề cần xử lý.','Theo dõi'],
  sl:['Vào / Ra ca','Kiểm tra thời gian lên ca, xuống ca, OT và các trường hợp chưa hoàn tất.','Vào/Ra ca'],
  l:['Đi trễ','Tổng hợp mức độ đi trễ theo nhân sự và thời gian.','Trễ'],
  o:['Lịch off','Quản lý lịch nghỉ theo tháng và tình trạng đăng ký.','Lịch off'],
  r:['Điểm danh','Theo dõi điểm danh tự động, lượt bù và kiểm tra đột xuất.','Điểm danh'],
  rp:['Báo cáo','Theo dõi tình trạng hoàn thành báo cáo và các ca còn nợ.','Báo cáo'],
  u:['Nhân sự','Quản lý hồ sơ, lịch làm, mã cá nhân và quyền truy cập.','Nhân sự'],
  m:['Quản trị viên','Quản lý tài khoản quản trị và phạm vi theo brand.','Quản trị viên']
};

function setTab(k) {
  if (k !== 'r') clearInterval(rcTimer);
  if (k !== 'b') clearInterval(bTimer);
  TAB = k;
  Object.entries(PANES).forEach(([key, [btn, pane]]) => {
    $('#' + btn).classList.toggle('on', key === k);
    $('#' + pane).hidden = key !== k;
  });

  const meta = TAB_META[k] || TAB_META.b;
  if ($('#pageTitle')) $('#pageTitle').textContent = meta[0];
  if ($('#pageDesc')) $('#pageDesc').textContent = meta[1];
  if ($('#crumbTitle')) $('#crumbTitle').textContent = meta[2];

  $('#exp').hidden = !(k === 'b' || k === 'l');
  if (k === 'b') { renderBoard(); startBoardTimer(); }
  else if (k === 'l') loadLate();
  else if (k === 'o') loadOffs();
  else if (k === 'sl') loadShiftLog();
  else if (k === 'r') { loadRollCalls(); startRcTimer(); }
  else if (k === 'rp') loadReports();
  else if (k === 'm') loadAdmins();
  else renderUsers();
}
Object.entries(PANES).forEach(([k, [btn]]) => $('#' + btn).addEventListener('click', () => setTab(k)));
$('#exp').addEventListener('click', () => {
  location.href = (TAB === 'b' ? '/api/admin/export.csv?' : '/api/punches/export.csv?')
    + (TAB === 'l' ? new URLSearchParams({ ...Object.fromEntries(new URLSearchParams(qp())), only_late: 1 }) : qp());
});

function tick() {
  if (!B || TAB !== 'b') return;
  const byId = {};
  B.lanes.forEach(c => { if (c.holder) byId[c.holder.id] = c.holder; });
  document.querySelectorAll('[data-cd]').forEach(el => {
    const h = byId[el.dataset.cd]; if (!h) return;
    const l = leftOf(h);
    el.textContent = clk(l);
    const lane = el.closest('.lane');
    if (lane && l < 0) { lane.classList.add('over'); lane.classList.remove('busy'); }
  });
  document.querySelectorAll('[data-fill]').forEach(el => {
    const h = byId[el.dataset.fill]; if (h) el.style.width = pctOf(h) + '%';
  });
}

load();
setInterval(tick, 1000);
setInterval(load, 20000);
</script>
</body>
</html>
