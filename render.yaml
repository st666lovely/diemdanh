services:
  - type: web
    name: tram-truc
    runtime: node          # Node có sẵn — không cần Docker, không cần nginx
    plan: starter          # KHÔNG dùng free: service ngủ sau 15 phút không có request,
                           # request đầu tiên sau đó mất 30–60 giây mới tỉnh.
    region: singapore      # gần Việt Nam nhất
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /healthz
    disk:
      name: data
      mountPath: /var/data # SQLite nằm ở đây, sống sót qua mỗi lần deploy
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR
        value: /var/data
      - key: NODE_ENV
        value: production
      - key: TZ
        value: Asia/Ho_Chi_Minh   # múi giờ máy chủ; giờ ca từng người theo khu vực VN/ARM riêng
      - key: SESSION_SECRET
        generateValue: true   # Render tự sinh, không cần tự nghĩ
      - key: ADMIN_USER
        value: admin
      - key: ADMIN_PASSWORD
        sync: false           # tự điền trong Dashboard, không lưu vào Git
      - key: MAX_OFF_PER_MONTH
        value: "15"           # số ngày off tối đa mỗi tháng
      - key: MAX_OFF_PER_DAY_DEPT
        value: "1"            # số người cùng bộ phận được nghỉ cùng một ngày
      - key: ROLL_CALLS_PER_SHIFT
        value: "4"            # số lượt điểm danh ngẫu nhiên mỗi ca
      - key: ROLL_CALL_WINDOW_MIN
        value: "5"            # số phút được phép xác nhận
      - key: ROLL_CALL_MAKEUP_MIN
        value: "3"            # sau khi dừng hoạt động bao lâu thì bắn lượt bù
      # ── Tuân thủ báo cáo: đọc Google Sheets duyệt rút / duyệt khuyến mãi ──
      - key: REPORT_SHEET_ID
        value: 19KQ7pC0bkzhIiMEy2BTsMWEFumWPF-37QsepFWH1viI
      - key: REPORT_SHEET_TAB
        value: Nhập liệu
      - key: REPORT_SHEET_TTL_MIN
        value: "10"           # bao lâu đọc lại sheet một lần
      - key: REPORT_BLOCK_AFTER
        value: "1"            # nợ mấy ca thì chặn vào ca mới
      - key: REPORT_ALERT_AFTER
        value: "3"            # nợ mấy ca thì cảnh báo khóa BO
      - key: REPORT_GRACE_MIN
        value: "60"           # sau giờ tan ca bao lâu mới tính là nợ
      - key: GOOGLE_SERVICE_ACCOUNT_EMAIL
        sync: false           # lấy từ file JSON key, điền trong Dashboard
      - key: GOOGLE_PRIVATE_KEY
        sync: false           # dán nguyên chuỗi -----BEGIN PRIVATE KEY-----...
